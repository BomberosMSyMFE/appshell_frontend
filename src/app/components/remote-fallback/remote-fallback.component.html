<div class="fallback-container">
  <div class="fallback-card">
    <div class="fallback-icon-wrapper">
      <i class="bi bi-hdd-network-fill"></i>
    </div>

    <div class="fallback-content">
      <div class="badge-row">
        <span class="badge-fire badge-fire-warning font-tactical-mono">
          <i class="bi bi-exclamation-triangle-fill"></i> MÓDULO NO DISPONIBLE
        </span>
      </div>

      <h2 class="fallback-title">{{ remoteName }}</h2>

      <p class="fallback-description">
        No se pudo establecer conexión con este módulo remoto en el puerto {{ port }}. Verifique que el servicio esté iniciado y en ejecución.
      </p>

      <div class="fallback-actions">
        <button class="btn-fire-primary" [disabled]="reintentando()" (click)="reintentarCarga()">
          <span *ngIf="!reintentando()">
            <i class="bi bi-arrow-clockwise"></i> Reintentar Conexión
          </span>
          <span *ngIf="reintentando()">
            <i class="bi bi-arrow-repeat spin-icon"></i> Reconectando...
          </span>
        </button>

        <a href="/crisis" class="btn-fire-outline">
          <i class="bi bi-broadcast-pin"></i> Ir a Sala de Crisis
        </a>
      </div>
    </div>
  </div>
</div>
